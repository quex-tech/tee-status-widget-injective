<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEE status example</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; padding: 1.5rem; }
  section { max-width: 26rem; }
  h2 { font-size: 0.85rem; margin: 0 0 0.5rem; }
  h2 code { font-weight: normal; opacity: 0.7; }
  .card {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 0.7rem 0.85rem;
    margin-top: 0.5rem;
  }
  .card-head b { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
  .addr {
    margin: 0.35rem 0 0.5rem;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
  }
  .line { display: flex; align-items: baseline; gap: 0.45rem; font-size: 0.82rem; }
  .line + .line { margin-top: 0.2rem; }
  .dim { opacity: 0.65; }
  hr { border: 0; border-top: 1px solid #8884; margin: 0.6rem 0; }
  .dot {
    flex: none;
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: #8b949e;
  }
  .dot.ok { background: #2ea043; }
  .dot.bad { background: #e5534b; }
  .note { font-size: 0.78rem; opacity: 0.7; min-height: 1.4em; margin: 0.3rem 0 0; }
  .note.error { color: #e5534b; opacity: 1; }
  input { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>

<!-- One call, one panel per enterprise validator. It subscribes to blocks and
     queries over the same socket, so it needs nothing cross-origin from the
     node. -->
<section>
  <h2>TEE status <code>fetchTEEStatus()</code></h2>
  <form id="ws-form">
    <input id="ws-node" value="ws://localhost:26687/websocket" size="26" spellcheck="false" aria-label="Node RPC websocket">
    <button type="submit">Reconnect</button>
  </form>

  <div id="panels"></div>
  <p class="note" id="ws-note"></p>
</section>

<template id="ev-panel">
  <div class="card">
    <div class="card-head"><b>Enterprise validator</b></div>
    <div class="addr" data-field="validator">—</div>
    <div class="line"><span class="dot" data-dot="live"></span><span data-field="live"></span></div>
    <div class="line"><span class="dot" data-dot="binding"></span><span data-field="binding"></span></div>
    <div class="line"><span class="dot" data-dot="sealed"></span><span data-field="sealed"></span></div>
    <div class="line"><span class="dot" data-dot="pins"></span><span data-field="pins"></span></div>
    <div class="line dim">signature chain not verified here</div>
  </div>
</template>

<script src="attestation.js"></script>
<script>
// The pins never change while the page is open, so this is fetched once and
// awaited wherever it is needed.
const expected = loadExpectedMeasurements();

const panels = document.getElementById("panels");
const template = document.getElementById("ev-panel");
const wsNode = document.getElementById("ws-node");
const wsNote = document.getElementById("ws-note");

// Declared before follow() runs: a `let` read from a function that runs first
// throws rather than reading as undefined.
let socket = null;
let reconnectTimer = null;
let busy = false;

document.getElementById("ws-form").addEventListener("submit", (e) => {
  e.preventDefault();
  follow();
});

// Subscribes to CometBFT's NewBlock events and re-queries on each one, over
// the one socket. Websockets are exempt from CORS and CometBFT accepts any
// origin, so this asks nothing of the node beyond a reachable RPC port.
function follow() {
  clearTimeout(reconnectTimer);
  if (socket) {
    // Drop the handler first: a socket closed on purpose must not queue a
    // reconnect that would race the one being opened right here.
    socket.onclose = null;
    socket.close();
  }

  socket = new WebSocket(wsNode.value.trim());
  socket.onopen = () => {
    socket.send(JSON.stringify({
      jsonrpc: "2.0",
      id: 1,
      method: "subscribe",
      params: { query: "tm.event='NewBlock'" },
    }));
    load();
  };
  socket.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    // Block events carry data; the subscribe ack and this widget's own query
    // replies do not, and are left to whoever asked for them.
    const block = msg.result && msg.result.data && msg.result.data.value.block;
    if (block) load();
  };
  socket.onclose = () => {
    show(null, "node not connected");
    note("disconnected — reconnecting…", true);
    reconnectTimer = setTimeout(follow, 3000);
  };
  socket.onerror = () => note("websocket error — check the RPC address", true);
}

async function load() {
  if (busy) return; // a block landed while the last query was still running
  busy = true;
  try {
    const status = await fetchTEEStatus(socket, await expected);
    show(status.validators, "no enterprise validator on this chain");
    note("block " + status.height, false);
  } catch (err) {
    // A failed query tells us nothing about the validator, so every lamp goes
    // back to grey. Leaving the last good answer on screen would be a lie.
    show(null, "node did not answer");
    note(err.message, true);
  } finally {
    busy = false;
  }
}

// ── rendering: free of any decision of its own ──────────────────────────────

const LAMPS = ["live", "binding", "sealed", "pins"];

// Rebuilt rather than patched: the set can change from one block to the next,
// and a panel apiece is cheap enough that diffing would be the more
// complicated thing. With nothing to show, one all-grey panel says why.
function show(validators, why) {
  panels.replaceChildren(
    ...(validators && validators.length ? validators.map((v) => panel(v)) : [panel(null, why)])
  );
}

function panel(v, why) {
  const el = template.content.firstElementChild.cloneNode(true);

  field(el, "validator", v ? v.valoper || "no operator address" : why);
  for (const lamp of LAMPS) {
    const check = v ? v.checks[lamp] : { ok: null, text: "unknown" };
    dot(el, lamp, check.ok);
    field(el, lamp, check.text);
  }
  return el;
}

function field(card, name, value) {
  card.querySelector(`[data-field="${name}"]`).textContent = value;
}

// Tristate: true green, false red, null grey.
function dot(card, name, state) {
  card.querySelector(`[data-dot="${name}"]`).className =
    "dot" + (state === null ? "" : state ? " ok" : " bad");
}

function note(msg, isError) {
  wsNote.textContent = msg;
  wsNote.className = isError ? "note error" : "note";
}

// Last, not first: everything above is declarations, and a `const` reached
// before its line throws rather than reading as undefined. Nothing is known
// until the node answers, and unknown is a grey lamp like any other — never a
// blank panel, and never a green one by default.
show(null, "waiting for the node");
follow();
</script>

</body>
</html>
